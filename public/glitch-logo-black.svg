<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <filter id="grunge-filter-dark" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="4" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="3" xChannelSelector="R" yChannelSelector="G" />
    </filter>
  </defs>

  <!-- Transparent background for watermark & print on white paper -->
  
  <!-- Outer Distressed Ring in dark charcoal/black -->
  <circle cx="250" cy="250" r="222" fill="none" stroke="#0f172a" stroke-width="5" stroke-dasharray="12 4 8 16 28 6 3 9 40 4" filter="url(#grunge-filter-dark)" opacity="0.9" />
  <circle cx="250" cy="250" r="217" fill="none" stroke="#0f172a" stroke-width="2.5" stroke-dasharray="24 8 4 12 18 6" opacity="0.8" />
  <circle cx="250" cy="250" r="226" fill="none" stroke="#0f172a" stroke-width="1.5" stroke-dasharray="3 7 14 4 30 10" opacity="0.6" />

  <!-- Inner Textured Ring Details -->
  <path d="M 60 250 A 190 190 0 0 1 440 250" fill="none" stroke="#0f172a" stroke-width="1.5" stroke-dasharray="5 15 25 8" opacity="0.3"/>
  <path d="M 440 250 A 190 190 0 0 1 60 250" fill="none" stroke="#0f172a" stroke-width="1.5" stroke-dasharray="15 6 30 12" opacity="0.3"/>

  <!-- GLITCH Brush Stylized Lettering -->
  <g transform="translate(250, 240) scale(1.05)" text-anchor="middle" dominant-baseline="central">
    <text x="0" y="0" font-family="'Impact', 'Arial Black', sans-serif" font-size="112" font-style="italic" font-weight="900" letter-spacing="4" fill="#0f172a" transform="skewX(-14)" filter="url(#grunge-filter-dark)">
      GLITCH
    </text>
    
    <!-- Glitch horizontal transparent cut slices -->
    <line x1="-190" y1="-15" x2="190" y2="-15" stroke="#ffffff" stroke-width="4.5" />
    <line x1="-160" y1="12" x2="175" y2="12" stroke="#ffffff" stroke-width="3.5" />
    <line x1="-120" y1="-32" x2="60" y2="-32" stroke="#ffffff" stroke-width="2.5" />
    <line x1="-50" y1="28" x2="140" y2="28" stroke="#ffffff" stroke-width="2.5" />
  </g>

  <!-- Tagline Subtitle: GEN Z MENSWEAR -->
  <g transform="translate(250, 332)">
    <line x1="-165" y1="-4" x2="-115" y2="-4" stroke="#0f172a" stroke-width="2" stroke-linecap="round" />
    <text x="0" y="0" font-family="'Arial', 'Inter', sans-serif" font-size="19" font-weight="700" letter-spacing="9" fill="#0f172a" text-anchor="middle" dominant-baseline="central">
      GEN Z MENSWEAR
    </text>
    <line x1="115" y1="-4" x2="165" y2="-4" stroke="#0f172a" stroke-width="2" stroke-linecap="round" />
  </g>
</svg>
